name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Go API (Go 1.27.3)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: restaurant
          POSTGRES_PASSWORD: restaurant_dev
          POSTGRES_DB: restaurant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restaurant -d restaurant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgres://restaurant:restaurant_dev@localhost:5432/restaurant?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: Resolve module graph
        run: go mod tidy
      - name: Verify locked Go modules
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Normalize Group 3 Go formatting for verification
        run: |
          gofmt -w .
          git diff --name-only -- '*.go' | while read -r file; do
            echo "FMT_BEGIN:$file"
            base64 -w0 "../../$file"
            echo
            echo "FMT_END:$file"
          done
      - name: Vet
        run: go vet ./...
      - name: Test including PostgreSQL integration
        run: go test -race -count=1 ./...
      - name: Build
        run: go build ./cmd/server

  web:
    name: Next.js (Node.js 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
