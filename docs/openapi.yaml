openapi: 3.1.0
info:
  title: Go Restaurant API
  version: 0.4.0
  description: Authentication, restaurant catalog, profiles, addresses and owned carts.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: API process liveness
      responses:
        '200':
          description: Process alive
  /readyz:
    get:
      summary: PostgreSQL readiness
      responses:
        '200':
          description: Database reachable
        '503':
          description: Database unreachable
  /api/v1/auth/providers:
    get:
      summary: Available configured OAuth providers
      responses:
        '200':
          description: Providers list
  /api/v1/auth/google/start:
    get:
      summary: Begin Google authorization-code login (PKCE)
      responses:
        '302':
          description: Redirect to Google
        '503':
          description: Provider not configured
  /api/v1/auth/google/callback:
    get:
      summary: Google OAuth callback
      responses:
        '303':
          description: Session issued, redirect to frontend
        '400':
          description: Invalid or replayed login state
  /api/v1/auth/apple/start:
    get:
      summary: Begin Apple authorization-code login
      responses:
        '302':
          description: Redirect to Apple
        '503':
          description: Provider not configured
  /api/v1/auth/apple/callback:
    post:
      summary: Apple OAuth form_post callback
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                state:
                  type: string
                code:
                  type: string
      responses:
        '303':
          description: Session issued, redirect to frontend
        '400':
          description: Invalid or replayed login state
  /api/v1/auth/logout:
    post:
      summary: Revoke current session
      security:
        - CookieSession: []
      responses:
        '204':
          description: Session revoked
        '403':
          description: Origin not allowed
  /api/v1/me:
    get:
      summary: Current authenticated user
      security:
        - CookieSession: []
      responses:
        '200':
          description: Current user and roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Authentication required
  /api/v1/admin/users:
    get:
      summary: List up to 100 users
      security:
        - CookieSession: []
      responses:
        '200':
          description: User listing (requires users.read)
        '403':
          description: Missing required permission
  /api/v1/admin/users/{userID}/roles:
    put:
      summary: Replace user's role assignments
      security:
        - CookieSession: []
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - roles
              properties:
                roles:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                    enum: [customer, rider, restaurant_manager, admin]
      responses:
        '200':
          description: Roles replaced (requires roles.manage)
        '400':
          description: Invalid role assignment
        '403':
          description: Missing permission or forbidden role change
  /api/v1/restaurants:
    get:
      summary: List published restaurants
      responses:
        '200': { description: Public restaurant list }
  /api/v1/restaurants/{restaurantID}/menu:
    get:
      summary: Public published menu with modifier options
      parameters:
        - { name: restaurantID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Restaurant catalog }
        '404': { description: Restaurant missing or unpublished }
  /api/v1/admin/restaurants/:
    get:
      summary: List restaurants visible to current administrator or manager
      security: [{ CookieSession: [] }]
      responses:
        '200': { description: Accessible restaurants }
        '401': { description: Authentication required }
    post:
      summary: Create a restaurant (administrator only)
      security: [{ CookieSession: [] }]
      responses:
        '201': { description: Restaurant ID }
        '403': { description: Permission denied }
  /api/v1/admin/restaurants/{restaurantID}/catalog:
    get:
      summary: View complete restaurant catalog including drafts
      security: [{ CookieSession: [] }]
      parameters:
        - { name: restaurantID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Restaurant catalog }
        '403': { description: Restaurant access denied }
  /api/v1/admin/restaurants/{restaurantID}:
    put:
      summary: Replace restaurant profile, keeping its currency fixed
      security: [{ CookieSession: [] }]
      parameters:
        - { name: restaurantID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Updated }
    delete:
      summary: Archive restaurant (administrator only)
      security: [{ CookieSession: [] }]
      parameters:
        - { name: restaurantID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Archived }
  /api/v1/admin/restaurants/{restaurantID}/categories/:
    post:
      summary: Create menu category
      security: [{ CookieSession: [] }]
      responses:
        '201': { description: Category ID }
  /api/v1/admin/restaurants/{restaurantID}/meals/:
    post:
      summary: Create meal priced in currency minor units
      security: [{ CookieSession: [] }]
      responses:
        '201': { description: Meal ID }
  /api/v1/admin/restaurants/{restaurantID}/meals/{mealID}/modifier-groups/:
    post:
      summary: Create meal modifier group
      security: [{ CookieSession: [] }]
      responses:
        '201': { description: Modifier group ID }
  /api/v1/admin/restaurants/{restaurantID}/meals/{mealID}/modifier-groups/{groupID}/options/:
    post:
      summary: Create modifier option
      security: [{ CookieSession: [] }]
      responses:
        '201': { description: Modifier option ID }
  /api/v1/me/profile:
    get:
      summary: Read own customer profile
      security: [{ CookieSession: [] }]
      responses:
        '200': { description: Customer profile }
        '401': { description: Authentication required }
    put:
      summary: Update own profile
      security: [{ CookieSession: [] }]
      responses:
        '200': { description: Updated profile }
  /api/v1/me/addresses:
    get:
      summary: List own delivery addresses
      security: [{ CookieSession: [] }]
      responses:
        '200': { description: Ordered owned addresses }
    post:
      summary: Create owned delivery address (max 15)
      security: [{ CookieSession: [] }]
      responses:
        '201': { description: Address created }
  /api/v1/me/addresses/{addressID}:
    put:
      summary: Update owned delivery address
      security: [{ CookieSession: [] }]
      parameters:
        - { name: addressID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Address updated }
    delete:
      summary: Delete owned delivery address
      security: [{ CookieSession: [] }]
      parameters:
        - { name: addressID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Address deleted }
  /api/v1/cart:
    get:
      summary: Read owned single-restaurant cart, repriced from published catalog
      security: [{ CookieSession: [] }]
      responses:
        '200': { description: Cart with validity and subtotal in minor units }
    delete:
      summary: Clear cart and release restaurant selection
      security: [{ CookieSession: [] }]
      responses:
        '204': { description: Cart cleared }
  /api/v1/cart/items:
    post:
      summary: Add meal and validated modifier selections to cart
      security: [{ CookieSession: [] }]
      responses:
        '201': { description: Cart item created }
        '409': { description: Unavailable item, invalid options or cart is from another restaurant }
  /api/v1/cart/items/{itemID}:
    put:
      summary: Replace cart item quantity
      security: [{ CookieSession: [] }]
      parameters:
        - { name: itemID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Updated quantity }
        '404': { description: Item not found or not owned }
    delete:
      summary: Remove owned cart item
      security: [{ CookieSession: [] }]
      parameters:
        - { name: itemID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Item removed }
components:
  securitySchemes:
    CookieSession:
      type: apiKey
      in: cookie
      name: gr_session
  schemas:
    User:
      type: object
      required: [id, email, display_name, roles]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        roles:
          type: array
          items:
            type: string
